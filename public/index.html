  <style>
    body {

    /* Splash screen for PWA */
    #splash {
      position: fixed;
      inset: 0;
      background: #0b0e14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash .splash-logo {
      font-size: 60px;
      color: #00ff88;
      animation: splashPulse 1.5s ease infinite;
    }
    #splash .splash-text {
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
      margin-top: 20px;
      letter-spacing: 2px;
    }
    #splash .splash-sub {
      color: #8b949e;
      font-size: 14px;
      margin-top: 8px;
    }
    @keyframes splashPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }
  </style>

<body>
  <!-- PWA Splash Screen -->
  <div id="splash">
    <div class="splash-logo">▶</div>
    <div class="splash-text">VIDEO SNAPPER</div>
    <div class="splash-sub">Loading your experience...</div>
  </div>

  <noscript>
    <div style="padding:40px;text-align:center;color:#fff;background:#0b0e14;font-family:Poppins,sans-serif;">
      <h1>⚠ JavaScript Required</h1>
      <p>Video Snapper Pro requires JavaScript to function. Please enable JavaScript in your browser settings.</p>
    </div>
  </noscript>

  <div id="root"></div>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('%PUBLIC_URL%/service-worker.js')
          .then(function(registration) {
            console.log('✅ Service Worker registered:', registration.scope);
          })
          .catch(function(error) {
            console.log('❌ Service Worker registration failed:', error);
          });
      });
    }

    // Hide splash screen after app loads
    window.addEventListener('load', function() {
      setTimeout(function() {
        var splash = document.getElementById('splash');
        if (splash) {
          splash.classList.add('hidden');
          setTimeout(function() { splash.remove(); }, 500);
        }
      }, 1500);
    });
  </script>
</body>
